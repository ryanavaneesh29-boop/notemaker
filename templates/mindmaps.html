<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mind Maps - Note Maker</title>
    <link rel="stylesheet" href="/static/css/styles.css">
    <style>
        .mindmap-container {
            display: flex;
            gap: 20px;
            min-height: 100vh;
            padding: 20px;
        }
        .mindmap-sidebar {
            width: 250px;
            border-right: 1px solid #ddd;
            padding-right: 20px;
            overflow-y: auto;
        }
        .mindmap-editor {
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        .mindmap-header {
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .mindmap-header input {
            flex: 1;
            padding: 8px 12px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 16px;
        }
        .mindmap-header button {
            padding: 8px 16px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .mindmap-header button:hover {
            background-color: #0056b3;
        }
        .mindmap-canvas {
            flex: 1;
            border: 1px solid #ddd;
            border-radius: 4px;
            background-color: #fafafa;
            overflow: hidden;
        }
        #mindmapContainer {
            width: 100%;
            height: 100%;
        }
        .mindmap-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .mindmap-list li {
            padding: 10px;
            cursor: pointer;
            border-radius: 4px;
            border: 1px solid #eee;
            margin-bottom: 8px;
            font-size: 14px;
            transition: background-color 0.2s;
        }
        .mindmap-list li:hover {
            background-color: #f0f0f0;
        }
        .mindmap-list li.active {
            background-color: #007bff;
            color: white;
            border-color: #0056b3;
        }
        .mindmap-new-btn {
            width: 100%;
            padding: 10px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin-bottom: 20px;
            font-weight: bold;
        }
        .mindmap-new-btn:hover {
            background-color: #218838;
        }
        .nav-bar {
            background-color: #f8f9fa;
            padding: 10px 20px;
            border-bottom: 1px solid #ddd;
            display: flex;
            gap: 20px;
            margin-bottom: 10px;
        }
        .nav-bar a {
            text-decoration: none;
            color: #333;
            font-weight: 500;
            padding: 5px 10px;
            border-radius: 4px;
        }
        .nav-bar a.active {
            background-color: #007bff;
            color: white;
        }
        .mindmap-list-header {
            font-weight: bold;
            margin-bottom: 15px;
            font-size: 14px;
            color: #666;
        }
        .delete-btn {
            display: inline-block;
            width: 20px;
            height: 20px;
            background-color: #dc3545;
            color: white;
            text-align: center;
            line-height: 20px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 12px;
            float: right;
        }
        .delete-btn:hover {
            background-color: #c82333;
        }
    </style>
</head>
<body>
    <div class="nav-bar">
        <a href="index.html">Notes</a>
        <a href="mindmaps.html" class="active">Mind Maps</a>
        <a href="subjects.html">Subjects</a>
        <a href="syllabus.html">Syllabus</a>
        <a href="/logout">Logout</a>
    </div>

    <div class="mindmap-container">
        <div class="mindmap-sidebar">
            <button class="mindmap-new-btn" onclick="newMindmap()">+ New Mind Map</button>
            <div class="mindmap-list-header">Your Mind Maps</div>
            <ul class="mindmap-list" id="mindmapList"></ul>
        </div>

        <div class="mindmap-editor">
            <div class="mindmap-header">
                <input type="text" id="mindmapTitle" placeholder="Enter mind map title..." />
                <button onclick="saveMindmap()">Save</button>
            </div>
            <div class="mindmap-canvas">
                <div id="mindmapContainer"></div>
            </div>
        </div>
    </div>

    <script src="/static/js/mindmaps.js"></script>
</body>
</html>
