<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mind Maps - Note Maker</title>
    <link rel="stylesheet" href="/static/css/styles.css">
    <style>
        body.subject-page .subject-picker {
            display: flex;
            gap: 20px;
            padding: 20px;
        }

        .mindmap-sidebar {
            width: 250px;
            background: #f8f9fa;
            border-radius: 4px;
            padding: 20px;
            border: 1px solid #dee2e6;
            height: fit-content;
        }

        .mindmap-editor-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: white;
            border-radius: 4px;
            border: 1px solid #dee2e6;
            overflow: hidden;
        }

        .mindmap-header {
            padding: 15px 20px;
            border-bottom: 1px solid #dee2e6;
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .mindmap-header input {
            flex: 1;
            padding: 8px 12px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
        }

        .mindmap-header button {
            padding: 8px 16px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }

        .mindmap-header button:hover {
            background-color: #0056b3;
        }

        .mindmap-header button.danger {
            background-color: #dc3545;
        }

        .mindmap-header button.danger:hover {
            background-color: #c82333;
        }

        .mindmap-canvas {
            flex: 1;
            overflow: auto;
            background: #fafafa;
            padding: 20px;
        }

        .mindmap-canvas canvas {
            background: white;
            border: 1px solid #e0e0e0;
            border-radius: 4px;
            display: block;
            margin: 0 auto;
        }

        .mindmap-new-btn {
            width: 100%;
            padding: 10px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin-bottom: 15px;
            font-weight: bold;
        }

        .mindmap-new-btn:hover {
            background-color: #218838;
        }

        .mindmap-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .mindmap-list li {
            padding: 10px;
            cursor: pointer;
            border-radius: 4px;
            border: 1px solid #e0e0e0;
            margin-bottom: 8px;
            font-size: 14px;
            background: white;
            transition: all 0.2s;
        }

        .mindmap-list li:hover {
            background-color: #e9ecef;
            border-color: #007bff;
        }

        .mindmap-list li.active {
            background-color: #007bff;
            color: white;
            border-color: #0056b3;
        }

        .mindmap-list-header {
            font-weight: bold;
            margin-bottom: 15px;
            font-size: 14px;
            color: #333;
        }
    </style>
</head>
<body class="subject-page">
    <header class="picker-header">
        <div>
            <p class="eyebrow">Mind Maps</p>
            <h1>Create and organize your mind maps</h1>
        </div>
        <div class="header-actions">
            <a class="back-link" href="index.html">Back to notes</a>
            <a class="back-link" href="/logout">Logout</a>
        </div>
    </header>

    <main class="subject-picker">
        <aside class="mindmap-sidebar">
            <button class="mindmap-new-btn" onclick="newMindmap()">+ New Mind Map</button>
            <div class="mindmap-list-header">Your Mind Maps</div>
            <ul class="mindmap-list" id="mindmapList"></ul>
        </aside>

        <section class="mindmap-editor-area">
            <div class="mindmap-header">
                <input type="text" id="mindmapTitle" placeholder="Enter mind map title..." />
                <button onclick="saveMindmap()">Save</button>
                <button class="danger" onclick="deleteCurrent()">Delete</button>
            </div>
            <div class="mindmap-canvas">
                <canvas id="mindmapCanvas" width="900" height="600"></canvas>
            </div>
        </section>
    </main>

    <script src="/static/js/mindmaps.js"></script>
    <script src="/static/js/page-state.js"></script>
</body>
</html>
